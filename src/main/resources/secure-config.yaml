# Secure configuration properties - values are encrypted using AES/CBC algorithm
# To encrypt a value: use the Mule Secure Properties Tool or Anypoint Studio
# Encrypted values use the format: ![encryptedValue]
#
# IMPORTANT: The encryption key must be provided at runtime via:
#   - Anypoint Studio: Run Configurations > Arguments > VM Arguments > -M-Dsecure.key=<your-key>
